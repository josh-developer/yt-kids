packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks dependency postinstall scripts unless allowlisted.
# These are build-tool binaries that need their install scripts.
onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"
  - esbuild
  - sharp
  - unrs-resolver
  - workerd
patchedDependencies:
  expo-modules-jsi@57.0.4: patches/expo-modules-jsi@57.0.4.patch
